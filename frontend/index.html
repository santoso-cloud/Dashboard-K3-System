<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K3 Safety Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 10% 10%, rgba(20, 108, 67, .16), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(14, 116, 144, .14), transparent 30%),
        #eef5f2;
    }

    .auth-page .auth-shell {
      width: min(100%, 430px);
    }

    .auth-page .login-card {
      margin: 0;
      padding: 38px 34px 30px;
      border: 1px solid rgba(20, 108, 67, .1);
      border-radius: 24px;
      box-shadow: 0 22px 55px rgba(22, 54, 41, .14);
    }

    .auth-page .brand-mark {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 20px;
      color: #fff;
      font-size: 28px;
      background: linear-gradient(135deg, #16804e, #0b5d42);
      box-shadow: 0 12px 22px rgba(20, 108, 67, .23);
    }

    .auth-page .login-card h1 {
      margin-bottom: 7px;
      color: #173b2d;
      font-size: 26px;
      text-align: center;
    }

    .auth-page .auth-subtitle {
      margin: 0 auto 27px;
      color: #6b7d75;
      font-size: 14px;
      text-align: center;
      line-height: 1.55;
    }

    .auth-page .auth-form {
      display: grid;
      gap: 14px;
    }

    .auth-page .auth-form label {
      display: block;
      margin-bottom: 7px;
      color: #365449;
      font-size: 13px;
      font-weight: 700;
    }

    .auth-page .auth-form input {
      width: 100%;
      min-height: 49px;
      background: #f8fbfa;
      border-color: #d4e2dc;
      border-radius: 11px;
    }

    .auth-page .auth-form input:focus {
      border-color: #16804e;
      box-shadow: 0 0 0 3px rgba(22, 128, 78, .12);
      outline: none;
    }

    .auth-page .auth-submit {
      width: 100%;
      min-height: 49px;
      margin-top: 5px;
      border-radius: 11px;
      background: linear-gradient(135deg, #16804e, #0b5d42);
      box-shadow: 0 9px 18px rgba(20, 108, 67, .18);
    }

    .auth-page .auth-submit:hover {
      background: linear-gradient(135deg, #1a8f5a, #08603f);
      transform: translateY(-1px);
    }

    .auth-page .auth-footer {
      margin: 23px 0 0;
      color: #84958e;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .auth-page .login-card { padding: 30px 22px 25px; }
    }
  </style>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section id="loginCard" class="card login-card">
      <div class="brand-mark" aria-hidden="true">🦺</div>
      <h1>K3 Safety System</h1>
      <p class="auth-subtitle">Sistem Informasi Keselamatan &amp; Kesehatan Kerja</p>
      <form id="loginForm" class="auth-form">
        <div>
          <label for="username">Username atau email</label>
          <input id="username" placeholder="Masukkan username atau email" autocomplete="username" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>
        <button class="auth-submit" type="submit">Masuk ke Sistem</button>
      </form>
      <p id="loginMessage"></p>
      <p class="auth-footer">Akses aman untuk pengguna terdaftar<br>© 2026 K3 Safety Management System</p>
    </section>

    <section id="app" class="hidden">
      <header>
        <div><h1>Dashboard K3 Safety</h1><p id="welcome"></p></div>
        <button id="logoutBtn" class="danger">Logout</button>
      </header>
      <div class="stats">
        <article class="card"><span>Insiden</span><strong id="incidents">0</strong></article>
        <article class="card"><span>Observasi</span><strong id="observations">0</strong></article>
        <article class="card"><span>Near Miss</span><strong id="nearMiss">0</strong></article>
        <article class="card"><span>Selesai</span><strong id="completed">0</strong></article>
      </div>

      <section class="card">
        <h2>Input Insiden</h2>
        <form id="incidentForm" class="grid">
          <input id="title" placeholder="Judul" required>
          <input id="location" placeholder="Lokasi" required>
          <input id="incident_date" type="date" required>
          <select id="severity"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
          <textarea id="description" placeholder="Deskripsi" required></textarea>
          <button>Simpan Insiden</button>
        </form>
      </section>

      <section class="card">
        <h2>Data Insiden</h2>
        <div class="table-wrap">
          <table><thead><tr><th>Judul</th><th>Lokasi</th><th>Tanggal</th><th>Severity</th><th>Status</th></tr></thead>
          <tbody id="incidentRows"></tbody></table>
        </div>
      </section>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
